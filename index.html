<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hello, World!</title>
<style>
  :root {
    --bg: #07070d;
    --card: rgba(255,255,255,0.04);
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #07070d; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    position: relative;
  }

  /* drifting rgb blobs */
  .blob {
    position: absolute;
    width: 50vmax; height: 50vmax;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .45;
    animation: drift 14s ease-in-out infinite alternate, hue 8s linear infinite;
  }
  .b1 { background: #ff0040; top: -15vmax; left: -15vmax; }
  .b2 { background: #00ff88; bottom: -18vmax; right: -12vmax; animation-delay: -4s, -2s; }
  .b3 { background: #2060ff; top: 25%; left: 35%; animation-delay: -8s, -5s; }
  @keyframes drift {
    to { transform: translate(12vmax, 8vmax) scale(1.25); }
  }
  @keyframes hue {
    to { filter: blur(90px) hue-rotate(360deg); }
  }

  /* rgb border card */
  .card {
    position: relative;
    z-index: 1;
    padding: 4rem 5rem;
    border-radius: 24px;
    background: var(--card);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    text-align: center;
    isolation: isolate;
  }
  .card::before, .card::after {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: 27px;
    background: conic-gradient(from var(--a, 0deg), #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
    z-index: -2;
    animation: spin 4s linear infinite;
  }
  .card::after {
    filter: blur(24px);
    opacity: .8;
  }
  .card > .inner-mask {
    position: absolute;
    inset: 0;
    border-radius: 24px;
    background: #0a0a14;
    z-index: -1;
  }
  @property --a {
    syntax: "<angle>";
    initial-value: 0deg;
    inherits: false;
  }
  @keyframes spin { to { --a: 360deg; } }

  h1 {
    font-size: clamp(2.5rem, 9vw, 6rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: slide 5s linear infinite;
    filter: drop-shadow(0 0 18px rgba(255,255,255,.25));
  }
  @keyframes slide { to { background-position: 300% 0; } }

  p {
    margin-top: 1rem;
    font-size: 1rem;
    letter-spacing: .4em;
    text-transform: uppercase;
    color: #fff;
    animation: glow 4s linear infinite;
  }
  @keyframes glow {
    0%   { text-shadow: 0 0 10px #f00; }
    17%  { text-shadow: 0 0 10px #ff0; }
    33%  { text-shadow: 0 0 10px #0f0; }
    50%  { text-shadow: 0 0 10px #0ff; }
    67%  { text-shadow: 0 0 10px #00f; }
    83%  { text-shadow: 0 0 10px #f0f; }
    100% { text-shadow: 0 0 10px #f00; }
  }

  @media (max-width: 520px) {
    .card { padding: 2.5rem 1.5rem; margin: 1rem; }
    p { letter-spacing: .25em; font-size: .8rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <main class="card">
    <div class="inner-mask"></div>
    <h1>Hello, World!</h1>
    <p>now with 16.7 million colors</p>
  </main>
</body>
</html>
