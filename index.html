<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mod Banner Generator</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--text:#e8eaf0;--mute:#8b93a5;--acc:#6ee7b7;--r:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 Inter,"Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:360px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:24px;overflow:auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:18px;margin:0;font-weight:700}
label,.lbl{display:block;font-size:13px;color:var(--mute);margin-bottom:6px}
input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:8px;font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input[type=range]{width:100%;accent-color:var(--acc)}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;color:var(--mute);cursor:pointer;display:flex;gap:12px;align-items:center;justify-content:center}
.drop.over,.drop:hover{border-color:var(--acc);color:var(--text)}
.drop img{width:44px;height:44px;object-fit:contain;image-rendering:pixelated;border-radius:6px;background:#000}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:13px}
.chip button{background:none;border:0;color:var(--mute);cursor:pointer;font-size:16px;line-height:1;padding:0 4px}
.chip button:hover{color:#ff7b7b}
.loaders{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ld{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;color:var(--mute);cursor:pointer;font:inherit}
.ld.on{border-color:var(--acc);color:var(--text)}
.ld img{width:28px;height:28px;object-fit:contain}
.ldw{position:relative}.ldw .ld{width:100%;padding-right:34px}.up{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--mute);cursor:pointer;font-size:14px;line-height:1;padding:0}.up:hover{color:var(--acc);border-color:var(--acc)}
select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:8px;font:inherit}
.fbtn{margin-top:8px;width:100%;background:var(--bg);border:1px dashed var(--line);color:var(--mute);border-radius:8px;padding:8px;cursor:pointer;font:inherit}.fbtn:hover{color:var(--text);border-color:var(--acc)}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between}
.row label{margin:0}
input[type=color]{width:40px;height:30px;border:1px solid var(--line);background:none;border-radius:6px;padding:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;background:var(--bg);color:var(--mute);border:0;padding:8px;cursor:pointer;font:inherit}
.seg button.on{background:var(--acc);color:#06281c;font-weight:600}
.chk{display:flex;gap:8px;align-items:center;color:var(--text);font-size:14px;margin:0}
.dl{background:var(--acc);color:#06281c;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:700;cursor:pointer;margin-top:auto}
.dl:hover{filter:brightness(1.08)}
main{display:grid;place-items:center;padding:32px;background:repeating-conic-gradient(#14171d 0 25%,#191c23 0 50%) 0 0/24px 24px}
canvas#c{max-width:100%;height:auto;box-shadow:0 20px 60px #0008}
@media(max-width:800px){body{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<aside>
  <h1>Mod banner generator</h1>

  <div><label for="name">Mod name</label><input type="text" id="name" value="Starcatcher"></div>
  <div><label for="author">Author</label><input type="text" id="author" value="wdiscute"></div>

  <div>
    <span class="lbl">Mod icon</span>
    <div class="drop" id="drop"><img id="thumb" alt="" hidden><span id="droptxt">Drop an image or click to upload</span></div>
    <input type="file" id="file" accept="image/*" hidden>
  </div>

  <div>
    <label for="ver">Versions (press Enter to add)</label>
    <input type="text" id="ver" placeholder="e.g. 1.21.1">
    <div class="chips" id="chips"></div>
  </div>

  <div><span class="lbl">Loaders</span><div class="loaders" id="loaders"></div></div>

  <div>
    <label for="font">Font</label>
    <select id="font"></select>
    <button type="button" class="fbtn" id="fup">Upload a font file</button>
    <input type="file" id="ffile" accept=".ttf,.otf,.woff,.woff2" hidden>
  </div>
  <div>
    <span class="lbl">Theme</span>
    <div class="seg" id="theme"><button data-v="dark">Dark</button><button data-v="light">Light</button></div>
  </div>
  <div class="row"><label for="acc">Accent</label><input type="color" id="acc" value="#6ee7b7"></div>
  <div class="row"><label for="ibg">Icon background</label><input type="color" id="ibg" value="#000000"></div>
  <div><label for="pad">Icon padding</label><input type="range" id="pad" min="0" max="120" value="24"></div>
  <div><label for="inset">Icon indent</label><input type="range" id="inset" min="0" max="60" value="16"></div>
  <div><label for="irad">Icon corner radius</label><input type="range" id="irad" min="0" max="120" value="28"></div>
  <div><label for="rad">Info panel corner radius</label><input type="range" id="rad" min="0" max="120" value="28"></div>
  <label class="chk"><input type="checkbox" id="pix" checked> Keep pixel art sharp</label>
  <label class="chk"><input type="checkbox" id="tint"> Tint loader icons with accent</label>
  <label class="chk"><input type="checkbox" id="trans"> Transparent text panel</label>

  <button class="dl" id="dl">Download PNG</button>
</aside>
<main><canvas id="c" width="1280" height="400"></canvas></main>

Object.values(DEF).forEach(d=>{d.im=new Image();d.im.onload=()=>render();d.im.src=d.src});
const uri=(k,col)=>'data:image/svg+xml;utf8,'+encodeURIComponent(SVGS[k].replace(/currentColor/g,col).replace('<svg ','<svg width="256" height="256" '));
function tinted(k,col){const key=k+col;if(!cache[key]){const im=new Image();im.onload=()=>render();im.src=uri(k,col);cache[key]=im}return cache[key]}
function drawIcon(k,c,x,y,s,col){const d=!custom[k]&&DEF[k],im=custom[k]||(d&&d.im)||tinted(k,col);if(!im.complete||!im.naturalWidth)return;c.imageSmoothingEnabled=!(d&&d.pix);
  const r=Math.min(s/im.naturalWidth,s/im.naturalHeight),w=im.naturalWidth*r,h=im.naturalHeight*r;c.drawImage(im,x+(s-w)/2,y+(s-h)/2,w,h);c.imageSmoothingEnabled=true}

/* ---- controls ---- */
const lb=$('loaders');
Object.keys(SVGS).forEach(k=>{
  const w=document.createElement('div');w.className='ldw';
  const b=document.createElement('button');b.className='ld';b.type='button';b.dataset.k=k;
  const im=document.createElement('img');im.src=DEF[k]?DEF[k].src:uri(k,'#e8eaf0');im.alt='';im.width=im.height=28;
  b.append(im,LABELS[k]);
  b.onclick=()=>{const i=S.loaders.indexOf(k);i<0?S.loaders.push(k):S.loaders.splice(i,1);sync()};
  const u=document.createElement('button');u.type='button';u.className='up';u.textContent='\u2191';u.title='Upload your own '+LABELS[k]+' icon';
  const fi=document.createElement('input');fi.type='file';fi.accept='image/*';
  fi.onchange=()=>{const f=fi.files[0];if(!f)return;const m=new Image();
    m.onload=()=>{custom[k]=m;im.src=m.src;u.textContent='\u00d7';u.title='Back to the default icon';render()};m.src=URL.createObjectURL(f);fi.value=''};
  u.onclick=()=>{if(custom[k]){delete custom[k];im.src=DEF[k]?DEF[k].src:uri(k,'#e8eaf0');u.textContent='\u2191';u.title='Upload your own '+LABELS[k]+' icon';render()}else fi.click()};
  w.append(b,u);lb.append(w)});
function sync(){
  document.querySelectorAll('.ld').forEach(b=>b.classList.toggle('on',S.loaders.includes(b.dataset.k)));
  document.querySelectorAll('#theme button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.theme));
  const ch=$('chips');ch.innerHTML='';
  S.versions.forEach((v,i)=>{const d=document.createElement('span');d.className='chip';d.textContent=v;
    const x=document.createElement('button');x.type='button';x.textContent='×';x.setAttribute('aria-label','Remove '+v);
    x.onclick=()=>{S.versions.splice(i,1);sync()};d.append(x);ch.append(d)});
  render()}
$('ver').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const v=e.target.value.trim();if(v){S.versions.push(v);e.target.value='';sync()}}});
document.querySelectorAll('#theme button').forEach(b=>b.onclick=()=>{S.theme=b.dataset.v;sync()});
['name','author','acc','ibg','pad','rad','irad','inset','pix','tint','font','trans'].forEach(id=>$(id).addEventListener('input',render));

const FONTS=[['Default (Inter / system)','Inter,"Segoe UI",system-ui,sans-serif'],['Arial','Arial,Helvetica,sans-serif'],['Verdana','Verdana,Geneva,sans-serif'],['Trebuchet MS','"Trebuchet MS",sans-serif'],['Tahoma','Tahoma,sans-serif'],['Georgia','Georgia,serif'],['Times New Roman','"Times New Roman",Times,serif'],['Courier New','"Courier New",monospace'],['Impact','Impact,"Arial Narrow",sans-serif'],['Comic Sans MS','"Comic Sans MS","Comic Sans",cursive']];
const fs=$('font');FONTS.forEach(([n,v])=>fs.add(new Option(n,v)));
$('fup').onclick=()=>$('ffile').click();
$('ffile').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{const name='Custom'+Date.now(),ff=new FontFace(name,await f.arrayBuffer(),{weight:'100 900'});await ff.load();document.fonts.add(ff);
    fs.add(new Option(f.name.replace(/\.\w+$/,''),`"${name}",sans-serif`));fs.selectedIndex=fs.options.length-1;render()}
  catch(err){alert('That file could not be loaded as a font. Try a .ttf, .otf, .woff or .woff2 file.')}e.target.value=''};

const drop=$('drop'),file=$('file');
drop.onclick=()=>file.click();
file.onchange=()=>load(file.files[0]);
drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};
drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');load(e.dataTransfer.files[0])};
function load(f){if(!f||!f.type.startsWith('image/'))return;
  const im=new Image();im.onload=()=>{S.img=im;$('thumb').src=im.src;$('thumb').hidden=false;$('droptxt').textContent=f.name;render()};
  im.src=URL.createObjectURL(f)}

/* ---- render ---- */
function render(){
  const dark=S.theme==='dark',fg=dark?'#f4f5f8':'#14161b',panel=dark?'#14161b':'#ffffff',acc=$('acc').value;
  const rad=+$('rad').value,irad=+$('irad').value,m=+$('inset').value,Z=H-m*2,ix=m+Z+m;
  ctx.clearRect(0,0,W,H);ctx.save();
  // info panel
  if(!$('trans').checked){rr(ctx,ix,m,W-m-ix,Z,rad);ctx.fillStyle=panel;ctx.fill()}
  // icon panel (indented, rounded)
  ctx.save();rr(ctx,m,m,Z,Z,irad);ctx.clip();
  ctx.fillStyle=$('ibg').value;ctx.fillRect(m,m,Z,Z);
  const p=+$('pad').value,box=Z-p*2;
  if(S.img){const k=Math.min(box/S.img.width,box/S.img.height),w=S.img.width*k,h=S.img.height*k;
    ctx.imageSmoothingEnabled=!$('pix').checked;ctx.drawImage(S.img,m+(Z-w)/2,m+(Z-h)/2,w,h);ctx.imageSmoothingEnabled=true}
  else{ctx.fillStyle='#ffffff22';ctx.font='600 22px Inter,system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Upload an icon',H/2,H/2);ctx.textAlign='left'}
  ctx.restore();

  // text block
  const x0=ix+48,maxW=W-m-x0-48;ctx.textBaseline='alphabetic';
  let ts=96;const FF=$('font').value;
  const title=$('name').value||'Mod name';
  do{ctx.font=`800 ${ts}px ${FF}`;ts-=2}while(ctx.measureText(title).width>maxW&&ts>32);ts+=2;
  const author=$('author').value;
  // pills
  ctx.font=`600 22px ${FF}`;const ph=44,gap=12;let rows=[[]],rw=0;
  S.versions.forEach(v=>{const w=ctx.measureText(v).width+40;if(rw+w>maxW&&rows[rows.length-1].length){rows.push([]);rw=0}rows[rows.length-1].push({v,w});rw+=w+gap});
  const hasP=S.versions.length>0,hasL=S.loaders.length>0,ls=64;
  const capOf=(wt,sz)=>{ctx.font=`${wt} ${sz}px ${FF}`;return ctx.measureText('H').actualBoundingBoxAscent};
  const AS=40,tcap=capOf(800,ts),acap=capOf(500,AS),g1=Math.round(ts*.2)+14,gp=author?30:Math.round(ts*.2)+20;
  ctx.font=`600 22px ${FF}`;const pcap=ctx.measureText('1').actualBoundingBoxAscent;
  let th=tcap+(author?g1+acap:0)+(hasP?gp+rows.length*ph+(rows.length-1)*gap:0)+(hasL?28+ls:0);
  const sc=Math.min(1,(Z-32)/th);th*=sc;
  ctx.save();ctx.translate(x0,(H-th)/2);ctx.scale(sc,sc);ctx.textBaseline='alphabetic';
  let y=tcap;ctx.fillStyle=fg;ctx.font=`800 ${ts}px ${FF}`;ctx.fillText(title,0,y);
  if(author){y+=g1+acap;ctx.font=`500 ${AS}px ${FF}`;ctx.fillStyle=dark?'#9aa2b4':'#5d6577';ctx.fillText('by '+author,0,y)}
  if(hasP){y+=gp-(author||!hasP?0:0);if(!author)y-=0;rows.forEach(r=>{let x=0;r.forEach(({v,w})=>{
      rr(ctx,x,y,w,ph,ph/2);ctx.fillStyle=acc+'22';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=acc;ctx.stroke();
      ctx.fillStyle=fg;ctx.font=`600 22px ${FF}`;ctx.textAlign='center';ctx.fillText(v,x+w/2,y+ph/2+pcap/2);ctx.textAlign='left';x+=w+gap});y+=ph+gap});y-=gap}
  if(hasL){y+=28;let x=0;S.loaders.forEach(k=>{
      const d=!custom[k]&&DEF[k],col=$('tint').checked?acc:fg;
      if(d&&d.frame){ctx.save();rr(ctx,x,y,ls,ls,14);ctx.clip();drawIcon(k,ctx,x,y,ls,col);ctx.restore()}
      else{rr(ctx,x,y,ls,ls,16);ctx.fillStyle=dark?'#ffffff12':'#00000010';ctx.fill();d?drawIcon(k,ctx,x+2,y+2,ls-4,col):drawIcon(k,ctx,x+10,y+10,ls-20,col)}
      x+=ls+12})}
  ctx.restore();ctx.restore()}

$('dl').onclick=()=>{cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download=(($('name').value||'mod').toLowerCase().replace(/\W+/g,'-'))+'-banner.png';a.click()},'image/png')};

(document.fonts?document.fonts.ready:Promise.resolve()).then(sync);
</script>
</body>
