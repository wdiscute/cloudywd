<style>
/* Timeless Echoes theme: violet sky fading into the black void, with faint stars */
:root{--accent:#efe6ff;--focus:#b48cff}
body{
  color:#ece4fa;
  background:
    radial-gradient(1.5px 1.5px at 12% 14%,rgba(255,255,255,.75),transparent 60%),
    radial-gradient(1px 1px at 24% 58%,rgba(255,255,255,.5),transparent 60%),
    radial-gradient(1.5px 1.5px at 37% 26%,rgba(255,255,255,.6),transparent 60%),
    radial-gradient(1px 1px at 49% 8%,rgba(255,255,255,.55),transparent 60%),
    radial-gradient(1px 1px at 58% 78%,rgba(255,255,255,.4),transparent 60%),
    radial-gradient(1.5px 1.5px at 69% 18%,rgba(255,255,255,.7),transparent 60%),
    radial-gradient(1px 1px at 82% 44%,rgba(255,255,255,.5),transparent 60%),
    radial-gradient(1.5px 1.5px at 91% 70%,rgba(255,255,255,.55),transparent 60%),
    radial-gradient(1px 1px at 7% 84%,rgba(255,255,255,.4),transparent 60%),
    radial-gradient(1px 1px at 76% 92%,rgba(255,255,255,.35),transparent 60%),
    radial-gradient(60% 40% at 30% 0%,rgba(190,140,255,.28),transparent 70%),
    radial-gradient(45% 35% at 80% 8%,rgba(170,120,240,.16),transparent 70%),
    linear-gradient(180deg,#5a3590 0,#3b2163 30%,#1c1033 65%,#08060d 100%);
  background-attachment:fixed;
}
h1{background:linear-gradient(180deg,#ffffff 0%,#e3d3ff 50%,#a57fe0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(200,160,255,.35))}
.tag{color:#bfaedb}
.btn{background:rgba(40,30,60,.35);border-color:rgba(200,170,255,.28)}
.btn:hover{background:rgba(120,90,170,.28);border-color:rgba(220,200,255,.7)}
.btn.main{color:#1c1033}
.ico{border-color:rgba(200,170,255,.7)}
.btn.main .ico{border-color:rgba(28,16,51,.7)}
.discord a{color:#d4c6ee}
.soon{color:#1c1033}
.back{color:#bfaedb}
